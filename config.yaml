# ==========================================
# ARTi Forge Configuration
# ==========================================

# Профиль оборудования: auto, high, low
# auto - автоматическое определение по доступной VRAM
profile: high

# Устройство для вычислений: cuda, cpu, mps
# оставьте пустым для автоопределения
device: ""

# -------------------------------------------------------
# Модели
# -------------------------------------------------------
models:
  text2image:
    # Ключ модели из реестра pipelines/__init__.py
    # Доступные: pixart_sigma, hunyuan_dit, sd_turbo
    high: pixart_sigma
    low: sd_turbo
    # Путь к модели (локальный или HuggingFace ID)
    high_path: "./models/PixArt-alpha/PixArt-Sigma-XL-2-1024-MS"
    low_path: "./models/stabilityai/sd-turbo"
    # Дополнительные параметры для PixArt-Sigma
    offload: false

  image2shape:
    # Ключ модели из реестра
    # Доступные: hunyuan_3d
    name: hunyuan_3d
    # Путь к модели формы
    shape_path: "./models/tencent/hunyuan3d-dit-v2-0-turbo"
    # Путь к модели текстурирования
    tex_path: "./models/tencent"
    # Подпапка в репозитории 
    subfolder: ""
    # Включить текстурирование
    enable_texture: true
    # Максимальное количество граней после упрощения
    max_faces: 40000

# -------------------------------------------------------
# Удалённые сервисы (если не заданы - используются локальные)
# -------------------------------------------------------
remote_services:
  text2image_url: ""
  image2shape_url: ""

# -------------------------------------------------------
# Сервер
# -------------------------------------------------------
server:
  host: "0.0.0.0"
  port: 8000
  # Папка для сохранения сгенерированных файлов
  save_dir: "./generated_models"
  # Время хранения файлов (часов)
  cleanup_hours: 24

# -------------------------------------------------------
# Микросервисы (порты для режима split)
# -------------------------------------------------------
microservices:
  text2image_port: 8001
  image2shape_port: 8002

# -------------------------------------------------------
# Логирование
# -------------------------------------------------------
logging:
  level: INFO
  file: "server.log"